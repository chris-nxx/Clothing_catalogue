<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mall Threads – Clothing Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="#" data-view="shop">Mall Threads</a>
      <nav>
        <button class="tab active" data-view="shop">Shop</button>
        <button class="tab" data-view="stores">Stores</button>
        <button class="tab" data-view="owner">Owner login</button>
      </nav>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="wrap">
    <!-- SHOP -->
    <section id="view-shop" class="view">
      <div class="filters" id="filters">
        <div class="field search"><label>Search</label><input id="search" type="search" placeholder="e.g. scarf"></div>
        <div class="field price"><label>Min price</label><input id="min_price" type="number" min="0" placeholder="0"></div>
        <div class="field price"><label>Max price</label><input id="max_price" type="number" min="0" placeholder="any"></div>
        <button id="apply" class="btn">Apply</button>
        <button id="reset" class="btn ghost">Reset</button>
      </div>
      <p id="count" class="muted"></p>
      <div id="grid" class="grid"></div>
      <div class="pager">
        <button id="prev" class="btn ghost">← Previous</button>
        <span id="page" class="muted"></span>
        <button id="next" class="btn ghost">Next →</button>
      </div>
    </section>

    <!-- STORES -->
    <section id="view-stores" class="view" hidden>
      <h2>Stores</h2>
      <div id="stores" class="grid stores"></div>
    </section>

    <!-- OWNER -->
    <section id="view-owner" class="view" hidden>
      <div id="login-box" class="panel narrow">
        <h2>Store owner login</h2>
        <form id="login-form">
          <div class="field"><label>Email</label><input id="email" type="email" required></div>
          <div class="field"><label>Password</label><input id="password" type="password" required></div>
          <button class="btn" type="submit">Log in</button>
          <p id="login-msg" class="msg"></p>
        </form>
      </div>

      <div id="dash" hidden>
        <div class="dash-head">
          <h2 id="dash-title">My products</h2>
          <div><span id="who" class="muted"></span> <button id="logout" class="btn ghost">Log out</button></div>
        </div>

        <!-- owner tools -->
        <div id="owner-tools">
          <details class="panel" id="add-box">
            <summary>+ Add a product</summary>
            <form id="add-form" class="form-grid">
              <div class="field"><label>Name</label><input id="a-name" required></div>
              <div class="field"><label>Price (KSh)</label><input id="a-price" type="number" min="1" step="any" required></div>
              <div class="field"><label>Category</label><select id="a-category" required></select></div>
              <div class="field"><label>Audience</label><select id="a-audience" required></select></div>
              <div class="field"><label>Colour</label><input id="a-colour"></div>
              <div class="field"><label>Picture path</label><input id="a-pic" placeholder="images/my_item.jpg"></div>
              <div class="field wide"><label>Description</label><input id="a-desc"></div>
              <div class="wide"><button class="btn" type="submit">Add product</button></div>
            </form>
          </details>
          <div id="mine" class="table"></div>
        </div>

        <!-- admin tools -->
        <div id="admin-box" class="panel narrow" hidden>
          <h3>Create an owner login</h3>
          <form id="owner-form">
            <div class="field"><label>Owner email</label><input id="o-email" type="email" required></div>
            <div class="field"><label>Password</label><input id="o-pass" type="password" required></div>
            <div class="field"><label>Store</label><select id="o-store" required></select></div>
            <button class="btn" type="submit">Create owner</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- PRODUCT DETAIL -->
  <div id="modal" class="modal" hidden>
    <div class="sheet">
      <button id="close" class="x" aria-label="Close">×</button>
      <div id="detail"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
